name: CICD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B clean compile

  security-check:
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - uses: actions/checkout@v4

      # ---------------------------
      # TRIVY INSTALL
      # ---------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo tee /usr/share/keyrings/trivy.asc
          echo "deb [signed-by=/usr/share/keyrings/trivy.asc] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -y
          sudo apt-get install -y trivy

      # ---------------------------
      # TRIVY (SAFE MODE - NO MAVEN CALLS)
      # ---------------------------
      - name: Trivy Scan (Secrets + Misconfig only)
        run: |
          trivy fs . \
            --scanners secret,misconfig \
            --skip-files pom.xml \
            --skip-dirs target,.m2 \
            --format table \
            -o trivy-report.json

      # ---------------------------
      # GITLEAKS (BEST SECRET SCANNER)
      # ---------------------------
      - name: Install Gitleaks
        run: |
          wget -qO gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect \
            --source . \
            -r gitleaks-report.json \
            -f json \
            --exit-code 1

      # ---------------------------
      # UPLOAD REPORTS (optional but recommended)
      # ---------------------------
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-report.json
            gitleaks-report.json
